<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification - NicPowch</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-body-family: 'Inter', system-ui, -apple-system, sans-serif;
      --color-primary: #0d9488;
      --color-primary-rgb: 13, 148, 136;
      --color-secondary: #10b981;
      --color-secondary-rgb: 16, 185, 129;
      --color-foreground: #0f172a;
      --color-foreground-rgb: 15, 23, 42;
      --border-radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 62.5%; }
    body {
      margin: 0;
      font-family: var(--font-body-family);
      font-size: 1.6rem;
      line-height: 1.6;
      color: var(--color-foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .age-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .age-modal__overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }
    .age-modal__content {
      position: relative;
      max-width: 28rem;
      width: 100%;
      background-color: white;
      border-radius: calc(var(--border-radius) * 2);
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }
    .age-modal__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, rgba(var(--color-primary-rgb), 0.1), rgba(var(--color-secondary-rgb), 0.1));
      border-radius: 50%;
      color: var(--color-primary);
    }
    .age-modal__title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem;
      color: var(--color-foreground);
    }
    .age-modal__message {
      color: rgba(var(--color-foreground-rgb), 0.7);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .age-modal__buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .age-modal__button {
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .age-modal__button--confirm {
      color: white;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
    }
    .age-modal__button--confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.3);
    }
    .age-modal__button--deny {
      color: var(--color-foreground);
      background-color: rgba(var(--color-foreground-rgb), 0.05);
      border: 1px solid rgba(var(--color-foreground-rgb), 0.1);
    }
    .age-modal__button--deny:hover {
      background-color: rgba(var(--color-foreground-rgb), 0.1);
    }
    .age-modal__legal {
      font-size: 0.75rem;
      color: rgba(var(--color-foreground-rgb), 0.5);
      margin: 1.5rem 0 0;
    }
    .age-modal__legal a {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="age-modal">
    <div class="age-modal__overlay"></div>
    <div class="age-modal__content">
      <div class="age-modal__icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
      </div>
      <h2 class="age-modal__title">Age Verification Required</h2>
      <div class="age-modal__message">
        <p>You must be 18 years or older to purchase nicotine products. By entering this site, you confirm you are of legal age.</p>
      </div>
      <div class="age-modal__buttons">
        <button type="button" class="age-modal__button age-modal__button--confirm">
          I am 18 or older
        </button>
        <button type="button" class="age-modal__button age-modal__button--deny">
          I am under 18
        </button>
      </div>
      <p class="age-modal__legal">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>
    </div>
  </div>
</body>
</html>
